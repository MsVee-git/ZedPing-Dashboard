name: Broadcast submission flow
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/BroadcastDetails.tsx'
      - '.github/workflows/broadcast-submission.yml'
permissions:
  contents: read
jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
