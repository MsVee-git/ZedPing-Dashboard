name: My Account validation
on:
  pull_request:
    paths:
      - 'src/MyAccount.tsx'
      - 'src/myAccount.css'
      - 'src/lib/accountManagement.js'
      - 'src/lib/authWorkspaceLifecycle.js'
      - 'src/lib/dashboardRouting.ts'
      - 'src/App.tsx'
      - 'src/WorkspaceUI.tsx'
      - 'test/accountManagement.test.js'
      - 'test/authWorkspaceLifecycle.test.js'
      - '.github/workflows/account-management.yml'
permissions:
  contents: read
jobs:
  account-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/accountManagement.test.js test/authWorkspaceLifecycle.test.js test/embeddedSignupRecovery.test.js
      - run: npm run build
